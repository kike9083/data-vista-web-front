
<VirtualHost *:80>
    ServerName datavista.ejemplo.com
    ServerAdmin webmaster@ejemplo.com
    DocumentRoot /var/www/html/datavista

    # Configuración del directorio raíz
    <Directory /var/www/html/datavista>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Configuración específica para la API
    <Directory /var/www/html/datavista/public/api>
        # Deshabilitar la navegación del directorio
        Options -Indexes
        # Permitir el uso de .htaccess
        AllowOverride All
        # Control de acceso
        Require all granted
        
        # Configurar PHP para este directorio
        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
            php_value display_errors Off
            php_value log_errors On
            php_value error_log /var/log/apache2/datavista_php_errors.log
        </FilesMatch>
    </Directory>

    # Configurar logs
    ErrorLog ${APACHE_LOG_DIR}/datavista_error.log
    CustomLog ${APACHE_LOG_DIR}/datavista_access.log combined

    # Configuración de seguridad adicional
    # Desactivar firmas de servidor
    ServerSignature Off
    
    # Restricciones de seguridad adicionales
    <IfModule mod_headers.c>
        # Prevenir clickjacking
        Header always set X-Frame-Options SAMEORIGIN
        # Prevenir MIME-sniffing
        Header always set X-Content-Type-Options nosniff
        # Habilitar protección XSS para navegadores antiguos
        Header always set X-XSS-Protection "1; mode=block"
        # Política de seguridad de contenido
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdn.gpteng.co; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'"
    </IfModule>
</VirtualHost>
